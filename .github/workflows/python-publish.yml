name: Run Gradio Live on GitHub

on:
  workflow_dispatch: # Dijalankan manual lewat tombol "Run workflow" di tab Actions

jobs:
  run-gradio:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Maksimal 6 jam per sesi di GitHub Actions gratis

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan Aplikasi Timnas Search
        run: python main.py
